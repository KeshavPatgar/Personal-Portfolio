      <stop offset="1" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="ring" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fc8019" stop-opacity="0.95" />
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0.95" />
